image: ubuntu:26.04

stages:
 - format
 - build
 - test
 - package

workflow:
  rules:
    # don't create a pipeline if its a commit pipeline, on a branch and that branch has open merge requests.
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - when: always

.dependencies:
  before_script:
    - apt-get update -qq
    - export DEBIAN_FRONTEND=noninteractive && apt-get install -y -qq
      casacore-dev
      cmake
      g++
      git
      libblas-dev liblapack-dev
      libboost-filesystem-dev libboost-program-options-dev libboost-test-dev
      libcfitsio-dev
      libfftw3-dev
      libgsl-dev
      libhdf5-dev
      libopenmpi-dev
      libpython3-dev
      pkg-config
      pybind11-dev
      python3-dev python3-numpy
      python3-sphinx
      python3-pip
      wget

format:
  stage: format
  extends: .dependencies
  script:
    # Update external/aocommon, which contains format.sh.
    - git submodule update --init external/aocommon
    - apt-get install -y -qq black clang-format-21 cmake-format isort
    # Check formatting of header (*.h), source (*.cpp), python and CMake files.
    - ./scripts/run-format.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: always

build-debug-without-everybeam:
  stage: build
  extends: .dependencies
  script:
    - apt-get install -y -qq python3-astropy python3-pytest
    - sed -i 's=-O3=-O1=' CMakeLists.txt # Disable optimizations
    # To test in and out of source builds, some builds do an in-source build whereas
    # here we do an out-of-source build.
    - mkdir /wsclean-build
    - cd /wsclean-build
    - cmake -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON  $CI_PROJECT_DIR/
    - make -j`nproc`
    - make -j`nproc` doc
    - make -j`nproc` install
    # For a push pipeline, run unittests only, otherwise run both unit and integration tests
    - if [[ $CI_PIPELINE_SOURCE == "push" ]] ; then make unitchecks; else make check; fi
    - cd $CI_PROJECT_DIR

build-with-everybeam-gcc12:
  stage: build
  extends: .dependencies
  script:
    - apt-get install -y -qq gcovr python3-astropy python3-pytest
    - mkdir -p /opt/everybeam/build
    - cd /opt/everybeam && git clone https://git.astron.nl/RD/EveryBeam.git
    - cd /opt/everybeam/EveryBeam && git checkout ef6f1ece70f00d0a0b43e70de26d7f3e657e4215
    - cd /opt/everybeam/build && cmake -DCMAKE_INSTALL_PREFIX=.. ../EveryBeam/
    - make -j`nproc` install
    - cd $CI_PROJECT_DIR && mkdir build && cd build
    - cmake -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DCMAKE_PREFIX_PATH='/opt/everybeam' -DCMAKE_CXX_FLAGS="-coverage -fprofile-update=atomic" -DCMAKE_EXE_LINKER_FLAGS="-coverage" ../
    - make -j`nproc` install
    # For a push pipeline, run unittests only, otherwise run both unit and integration tests
    - if [[ $CI_PIPELINE_SOURCE == "push" ]] ; then make unitchecks; else make check; fi
    - gcovr --merge-mode-functions=separate -r .. -e '.*/external/.*' -e '.*/build/.*' -e '.*/tests/.*' --txt --xml coverage.xml --json coverage.json .
  artifacts:
    paths:
      - build/coverage.json
    reports:
      coverage_report:
        coverage_format: cobertura
        path: build/coverage.xml
  coverage: '/^TOTAL.*\s+(\d+\%)$/'

pages:
  stage: package
  needs: ["build-with-everybeam-gcc12"]
  variables:
    OUTPUT: public/$CI_COMMIT_REF_SLUG
  before_script:
    - apt-get update -qq
    - export DEBIAN_FRONTEND=noninteractive && apt-get install -y -qq gcovr
  script:
    - echo Deploying GitLab pages to $CI_PAGES_URL/$CI_COMMIT_REF_SLUG
    - mkdir -p $OUTPUT
    - gcovr --merge-mode-functions=separate -e 'build/.*' -a build/coverage.json --html-details $OUTPUT/index.html
  artifacts:
    name: $CI_COMMIT_REF_SLUG
    paths:
      - public
    expire_in: 1 week

.test-das6-common:
  stage: test
  needs: []
  tags:
    - das6
  before_script:
    - source scripts/das6_modules.sh
    - export OPENBLAS_NUM_THREADS=1
    # Make OpenMPI ignore SLURM restrictions (in MPI tests).
    - export OMPI_MCA_rmaps_base_oversubscribe=1
    - export PYTHONPATH=${PYTHONPATH}:~/.local/lib/python3.11/site-packages
    # 20250724: UCX memory allocation failed. It suggested raising the lock limit.
    - ulimit -l unlimited
    - mkdir -p build && cd build
    - cmake -DBUILD_TESTING=ON -DCMAKE_CXX_FLAGS="-D_GLIBCXX_ASSERTIONS" -DCFITSIO_ROOT_DIR=$CFITSIO_ROOT -DCASACORE_ROOT_DIR=$CASACORE_ROOT -DCMAKE_INSTALL_PREFIX=. -DCMAKE_PREFIX_PATH="${IDG_ROOT};${EVERYBEAM_ROOT};${FFTW_ROOT}" -DPython3_EXECUTABLE=`which python` ..
    - make -j`nproc`

test-nightly-das6:
  extends: .test-das6-common
  script:
    - export CI_RUNNER_TAGS=$CI_RUNNER_TAGS
    - cd $CI_PROJECT_DIR/build
    - make nightlychecks
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
    - if: $CI_PIPELINE_SOURCE == "push"
      when: manual
      allow_failure: true

test-facet-shared-reads-slow-das6:
  extends: .test-das6-common
  script:
    - cd $CI_PROJECT_DIR/build
    # Clean, targeted build hook that manages its own parameters via CMake
    - make longfacetchecks
  rules:
    # Ensure it stays skipped on routine automated scheduled nightly events
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    # Keep it configured as an optional manual evaluation checkpoint on pushes/MRs
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
    - if: $CI_PIPELINE_SOURCE == "push"
      when: manual
      allow_failure: true

test-system-das6:
  extends: .test-das6-common
  variables:
    # Remove testing directory at end of tests
    CLEANUP_WSCLEAN_TESTS: 1
  script:
    - cd $CI_PROJECT_DIR/build
    - make longsystemchecks
    - mkdir $CI_PROJECT_DIR/reports
    - mv check_*.xml $CI_PROJECT_DIR/reports/
  artifacts:
    paths:
      - reports/check_*.xml
    reports:
      junit: reports/check_*.xml
  rules:
    # Do not run for all scheduled pipelines
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SYSTEM_TESTS == "true"
      when: always
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
    - if: $CI_PIPELINE_SOURCE == "push"
      when: manual
      allow_failure: true

package:
  stage: package
  variables:
    PACKAGE_FILE: "wsclean-${CI_COMMIT_TAG}.tar.bz2"
    PACKAGE_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/sources/${CI_COMMIT_TAG}/wsclean-${CI_COMMIT_TAG}.tar.bz2"
  before_script:
    - apt-get update -qq
    - export DEBIAN_FRONTEND=noninteractive && apt-get install -y -qq curl git python3-pip
    - pip3 install git-archive-all --break-system-packages
  script:
    - |
      git-archive-all --force-submodules ${PACKAGE_FILE}
      curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file ${PACKAGE_FILE} ${PACKAGE_URL}
  rules:
    - if: $CI_COMMIT_TAG
